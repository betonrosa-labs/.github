name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
  - type: input
    id: where
    attributes:
      label: Where (tool, file or module)
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, environment (versions), data or model used
    validations:
      required: true
